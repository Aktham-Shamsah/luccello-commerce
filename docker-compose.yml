# Development-only PostgreSQL for running Node.js apps on the host.
# For the complete Ubuntu deployment use compose.yaml instead.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: luccello
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d luccello"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_dev_data:
