name: Deploy GitHub Pages Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static storefront preview
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /luccello-commerce
          NEXT_PUBLIC_SITE_URL: https://aktham-shamsah.github.io/luccello-commerce
        run: pnpm --filter @luccello/storefront build
      - name: Disable Jekyll processing
        run: touch apps/storefront/out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/storefront/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
